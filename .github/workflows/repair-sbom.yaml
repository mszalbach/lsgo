name: Repair release image SBOM

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Digest of the existing GHCR image to attest"
        required: true
        type: string
        default: "sha256:eb6583c55b07214d6aac3b61ce93ddd81c783127c614e052939d47a62ca94ae8"
      skip_transparency_log:
        description: "Use only if standard signing fails with Rekor 409; this omits a new transparency-log entry"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Set up Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and attest SBOM
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SKIP_TRANSPARENCY_LOG: ${{ inputs.skip_transparency_log }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image_digest must be a sha256 digest with 64 lowercase hexadecimal characters" >&2
            exit 1
          fi

          image="ghcr.io/mszalbach/lsgo@${IMAGE_DIGEST}"
          syft "registry:${image}" -o cyclonedx-json=lsgo.sbom.json

          attest_args=(attest --yes --type cyclonedx --predicate lsgo.sbom.json)
          if [[ "$SKIP_TRANSPARENCY_LOG" == "true" ]]; then
            echo "::warning::Attesting without a new Rekor entry. Verification must use --insecure-ignore-tlog."
            attest_args+=(--tlog-upload=false)
          fi
          cosign "${attest_args[@]}" "$image"

          verify_args=(verify-attestation
            --type cyclonedx
            --certificate-identity-regexp "https://github.com/mszalbach/lsgo/.*"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com")
          if [[ "$SKIP_TRANSPARENCY_LOG" == "true" ]]; then
            verify_args+=(--insecure-ignore-tlog)
          fi
          cosign "${verify_args[@]}" "$image"
