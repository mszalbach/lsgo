name: Release

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "preview without creating a tag"
        required: true
        default: true
        type: boolean

jobs:
  qa:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: qa
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.semantic-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install Semantic Release
        run: |
          npm install --no-save semantic-release @semantic-release/commit-analyzer

      - name: Run Semantic Release
        id: semantic-release
        env:
          DRY_RUN: ${{ inputs.dry_run || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          before_tags="$(git tag --list | sort)"
          npx semantic-release --dry-run="$DRY_RUN"
          after_tags="$(git tag --list | sort)"
          mapfile -t new_tags < <(comm -13 <(printf '%s\n' "$before_tags") <(printf '%s\n' "$after_tags"))
          if (("${#new_tags[@]}" > 1)); then
            echo "Expected at most one new release tag, found: ${new_tags[*]}" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "${new_tags[0]:-}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.release_tag != ''
    permissions:
      actions: read # needed for sbom task to see the release
      contents: write # needed by goreleaser to write release to github
      packages: write # needed by goreleaser to upload docker
      id-token: write # needed for signing the images with GitHub OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 0 # needed for goreleaser to correctly create changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Set up Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and attest image SBOMs
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          jq -r '.[] | select(.type == "Docker Image") | [.path, .extra.Digest] | @tsv' <<< "$ARTIFACTS" | \
          while IFS=$'\t' read -r image digest; do
            [ -z "$image" ] && continue

            repository="${image%:*}"
            filename="${image//[\/:]/_}"

            # Generate SBOM
            syft "registry:$image" -o "cyclonedx-json=dist/${filename}.sbom.json"

            # Attest SBOM
            cosign attest --yes \
              --type cyclonedx \
              --predicate "dist/${filename}.sbom.json" \
              "${repository}@${digest}"
          done