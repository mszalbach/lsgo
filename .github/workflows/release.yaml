name: Release

env:
  # renovate: datasource=golang-version packageName=golang
  GOLANG_VERSION: '1.27.4'

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3" # every Wednesday at 00:00 UTC

jobs:
  qa:
    uses: ./.github/workflows/ci.yaml

  tag:
    needs: qa
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.semantic-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Semantic Release
        run: npm ci

      - name: Run Semantic Release
        id: semantic-release
        run: |
          set -euo pipefail
          before_tags="$(git tag --list | sort)"
          npx semantic-release
          after_tags="$(git tag --list | sort)"
          mapfile -t new_tags < <(comm -13 <(printf '%s\n' "$before_tags") <(printf '%s\n' "$after_tags"))
          if (("${#new_tags[@]}" > 1)); then
            echo "Expected at most one new release tag, found: ${new_tags[*]}" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "${new_tags[0]:-}" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.release_tag != ''
    permissions:
      actions: read # needed for sbom task to see the release
      contents: write # needed by goreleaser to write release to github
      packages: write # needed by goreleaser to upload docker
      id-token: write # needed for signing the images with GitHub OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0 # needed for goreleaser to correctly create changelog

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: true

      - name: Set up Syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and attest image SBOMs
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          jq -r '.[] | select(.type == "Docker Image") | [.path, .extra.Digest] | @tsv' <<< "$ARTIFACTS" | \
          while IFS=$'\t' read -r image digest; do
            [ -z "$image" ] && continue

            repository="${image%:*}"
            filename="${image//[\/:]/_}"

            # Generate SBOM
            syft "registry:$image" -o "cyclonedx-json=dist/${filename}.sbom.json"

            # Attest SBOM
            cosign attest --yes \
              --type cyclonedx \
              --predicate "dist/${filename}.sbom.json" \
              "${repository}@${digest}"
          done