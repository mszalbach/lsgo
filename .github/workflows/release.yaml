name: Release

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "preview without creating a tag"
        required: true
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install Semantic Release
        run: |
          npm install --no-save semantic-release @semantic-release/commit-analyzer

      - name: Run Semantic Release
        run: |
          npx semantic-release --dry-run=${{ inputs.dry_run || github.event_name == 'schedule' }}