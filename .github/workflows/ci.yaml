name: build
permissions:
  contents: read
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Run Tests
        run: make test

      - name: Vulnerability Scan
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    permissions:
      actions: read # needed for sbom task to see the release
      contents: write # needed by goreleaser to write release to github
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # needed for goreleaser to correctly create changelog

      - name: install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0.24.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
