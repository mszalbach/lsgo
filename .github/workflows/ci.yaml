name: build
permissions:
  contents: read
on: [push]
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"

      - name: Run Tests
        run: make test

  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: checkout
  #       uses: actions/checkout@v7.0.1

  #     - name: install go
  #       uses: actions/setup-go@v7.0.0
  #       with:
  #         go-version: "1.27.1"

  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v4.4.1

  #     - name: Set up goreleaser
  #       uses: goreleaser/goreleaser-action@v7.2.3
  #       with:
  #         install-only: true

  #     - name: Run e2e Tests
  #       run: make e2e


  vulcheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: Vulnerability Scan
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      # - e2e
      - vulcheck
    permissions:
      actions: read # needed for sbom task to see the release
      contents: write # needed by goreleaser to write release to github
      packages: write # needed by goreleaser to upload docker
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # needed for goreleaser to correctly create changelog

      - name: install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
